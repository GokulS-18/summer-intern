<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Recipe Maker</title>
<style>
  :root{
    --bg:#fff8f0; --card:#ffffff; --text:#2b2118; --muted:#7a6a5c; --line:#f0e1d0;
    --accent:#e8590c; --accent-d:#c94a07; --accent-soft:#ffe8d6; --ok:#2f9e44; --bubble-ai:#f6efe7; --bubble-me:#e8590c;
    --shadow:0 6px 24px rgba(120,70,20,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1511; --card:#241d17; --text:#f4ebe1; --muted:#b5a393; --line:#3a2f26;
      --accent:#ff8a3d; --accent-d:#ff9f5e; --accent-soft:#3b2a1d; --ok:#51cf66; --bubble-ai:#2f261e; --bubble-me:#d9480f; --shadow:0 6px 24px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header{text-align:center;padding:32px 16px 8px}
  header h1{margin:0;font-size:clamp(1.7rem,4vw,2.4rem)}
  header p{margin:6px 0 0;color:var(--muted)}
  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
  h2{margin:0 0 12px;font-size:1.15rem}
  .hidden{display:none!important}

  /* ingredient input */
  .chip-box{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px solid var(--line);border-radius:14px;min-height:54px;cursor:text;background:var(--bg)}
  .chip-box:focus-within{border-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-d);padding:5px 6px 5px 12px;border-radius:999px;font-size:.92rem;font-weight:600}
  .chip button{border:0;background:transparent;color:inherit;font-size:1.1rem;line-height:1;cursor:pointer;padding:0 4px}
  .chip-box input{flex:1;min-width:140px;border:0;outline:0;background:transparent;color:var(--text);font-size:1rem;padding:6px}
  .hint{font-size:.85rem;color:var(--muted);margin:8px 2px 0}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .quick button{border:1px dashed var(--accent);background:transparent;color:var(--accent-d);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
  .quick button:hover{background:var(--accent-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;padding:13px 22px;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--accent-d)} .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent-d);border:2px solid var(--accent)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.block{width:100%;margin-top:16px}
  .error{margin-top:12px;padding:10px 14px;border-radius:10px;background:#ffe3e3;color:#a61e1e;font-size:.92rem}
  @media (prefers-color-scheme: dark){.error{background:#4a1f1f;color:#ffb3b3}}

  /* recipe */
  .recipe-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .recipe-head h2{font-size:1.5rem;margin:0}
  .ing-list{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .ing-list span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:.88rem}
  .progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 6px}
  .progress div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fab005);transition:width .4s}
  .progress-label{font-size:.85rem;color:var(--muted)}
  .steps{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
  .step{display:flex;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);animation:pop .3s ease}
  .step .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line);color:var(--muted)}
  .step.current{border-color:var(--accent);background:var(--accent-soft)}
  .step.current .num{background:var(--accent);color:#fff}
  .step.done .num{background:var(--ok);color:#fff}
  .step.done p{color:var(--muted)}
  .step p{margin:4px 0 0}
  .finished{margin-top:14px;padding:14px;border-radius:14px;background:var(--accent-soft);text-align:center;font-weight:700}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding:4px 2px 10px}
  .msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;animation:pop .25s ease}
  .msg.ai{background:var(--bubble-ai);border-bottom-left-radius:4px;align-self:flex-start}
  .msg.me{background:var(--bubble-me);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .chat-form{display:flex;gap:8px;margin-top:6px}
  .chat-form input{flex:1;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem;outline:0}
  .chat-form input:focus{border-color:var(--accent)}
  .suggest{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .suggest button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
  .suggest button:hover{border-color:var(--accent)}

  .spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 30px}
</style>

<style id="premium-motion-ui">
:root{
  --bg:#fff8f0;--card:rgba(255,255,255,.82);--text:#2b2118;--muted:#806b5a;
  --line:#f2dfcc;--accent:#f97316;--accent-d:#c2410c;--accent-soft:#ffedd5;
  --ok:#16a34a;--bubble-ai:#fff1e5;--bubble-me:#ea580c;
  --shadow:0 22px 70px rgba(124,45,18,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-height:100vh;overflow-x:hidden;position:relative;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(ellipse at 12% 4%,rgba(251,146,60,.24),transparent 32%),
    radial-gradient(ellipse at 92% 22%,rgba(253,186,116,.22),transparent 28%),
    linear-gradient(135deg,#fffaf4 0%,#fff2e4 52%,#fffaf5 100%);
  background-attachment:fixed;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.20;
  background-image:radial-gradient(#c2410c .7px,transparent .7px);
  background-size:22px 22px;mask-image:linear-gradient(to bottom,black,transparent 85%);
}
.ambient-orb{position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(2px);opacity:.45;animation:orbDrift 16s ease-in-out infinite alternate}
.orb-one{width:300px;height:300px;top:16%;left:-180px;background:radial-gradient(circle,#fdba74,transparent 70%)}
.orb-two{width:360px;height:360px;right:-210px;top:45%;background:radial-gradient(circle,#fed7aa,transparent 70%);animation-delay:-6s}
.orb-three{width:240px;height:240px;left:35%;bottom:-170px;background:radial-gradient(circle,#fef3c7,transparent 70%);animation-delay:-10s}
header{text-align:center;padding:62px 18px 24px;animation:heroReveal .9s cubic-bezier(.2,.8,.2,1) both}
header:before{
  content:"✨ YOUR PERSONAL AI CHEF";display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:18px;padding:8px 15px;border-radius:999px;border:1px solid #fed7aa;
  background:rgba(255,237,213,.78);color:#9a3412;font-size:.72rem;font-weight:850;letter-spacing:.14em;
  box-shadow:0 8px 24px rgba(249,115,22,.10);animation:badgeFloat 4s ease-in-out infinite;
}
header h1{
  margin:0;font-size:clamp(2.5rem,6vw,4.5rem);line-height:1.04;letter-spacing:-.065em;
  background:linear-gradient(100deg,#7c2d12 4%,#ea580c 42%,#fb923c 72%,#c2410c);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleShimmer 8s linear infinite;
}
header p{max-width:620px;margin:17px auto 0;color:#806b5a;font-size:clamp(.98rem,2vw,1.12rem);line-height:1.7}
main{max-width:920px;margin:0 auto;padding:16px 20px 46px}
.card{
  position:relative;isolation:isolate;overflow:hidden;margin-bottom:22px;
  padding:clamp(22px,4vw,38px);border:1px solid rgba(255,237,213,.98);border-radius:28px;
  background:rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(124,45,18,.08),inset 0 1px 0 rgba(255,255,255,.95);
  animation:sectionReveal .7s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,border-color .35s ease;
}
.card:nth-child(2){animation-delay:.10s}.card:nth-child(3){animation-delay:.18s}
.card:before{
  content:"";position:absolute;z-index:-1;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#fb923c,#f97316,#fbbf24,#fb923c);background-size:250% 100%;
  transform:scaleX(.35);transform-origin:left;transition:transform .5s ease;animation:toplineFlow 7s linear infinite;
}
.card:after{
  content:"";position:absolute;z-index:-1;width:180px;height:180px;right:-100px;top:-110px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,146,60,.11),transparent 70%);transition:transform .5s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:0 28px 75px rgba(124,45,18,.13);border-color:#fed7aa}
.card:hover:before{transform:scaleX(1)}
.card:hover:after{transform:scale(1.7)}
h2{margin:0 0 17px;font-size:clamp(1.2rem,2.7vw,1.5rem);letter-spacing:-.035em}
.hint{color:#927b68;font-size:.9rem;line-height:1.6}
.chip-box{
  display:flex;flex-wrap:wrap;gap:9px;padding:13px;border:2px solid #f2dfcc;border-radius:18px;
  min-height:60px;background:rgba(255,250,245,.9);transition:border-color .25s,box-shadow .25s,transform .25s;
}
.chip-box:focus-within{border-color:#fb923c;box-shadow:0 0 0 5px rgba(249,115,22,.11);transform:translateY(-1px)}
.chip{background:linear-gradient(120deg,#ffedd5,#fff1e5);border:1px solid #fed7aa;color:#9a3412;padding:7px 9px 7px 13px;box-shadow:0 4px 12px rgba(194,65,12,.06);animation:chipAppear .32s cubic-bezier(.2,.8,.2,1) both}
.chip button{border-radius:50%;transition:background .2s,transform .2s}.chip button:hover{background:rgba(194,65,12,.12);transform:rotate(90deg)}
.chip-box input{font:inherit;min-width:150px}
.quick{gap:9px;margin-top:16px}
.quick button,.suggest button{
  border:1px solid #f2dfcc;background:rgba(255,250,245,.8);color:#80502f;border-radius:999px;
  padding:8px 14px;font-weight:650;transition:transform .22s ease,background .22s,border-color .22s,box-shadow .22s;
}
.quick button{border-style:dashed;border-color:#fdba74;color:#c2410c}
.quick button:hover,.suggest button:hover{transform:translateY(-3px) scale(1.02);background:#ffedd5;border-color:#fb923c;box-shadow:0 9px 20px rgba(249,115,22,.12)}
.quick button:active,.suggest button:active{transform:scale(.96)}
.btn{
  position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:0;border-radius:15px;padding:14px 23px;color:#fff;font-weight:800;font-size:1rem;letter-spacing:.005em;
  background:linear-gradient(110deg,#c2410c,#ea580c 42%,#f97316 72%,#fb923c);background-size:220% 100%;
  box-shadow:0 10px 24px rgba(234,88,12,.22);transition:transform .22s ease,box-shadow .22s ease,filter .22s,background-position .4s;
}
.btn:before{
  content:"";position:absolute;inset:-80% auto -80% -45%;width:35%;background:rgba(255,255,255,.25);
  transform:rotate(24deg) translateX(-220%);transition:transform .75s ease;z-index:-1;
}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 16px 30px rgba(234,88,12,.28);background-position:100% 0}
.btn:hover:not(:disabled):before{transform:rotate(24deg) translateX(650%)}
.btn:active:not(:disabled){transform:translateY(0) scale(.985)}
.btn:disabled{filter:saturate(.65);cursor:wait}
.btn.block{margin-top:22px;min-height:54px}
.btn.ghost{background:rgba(255,247,237,.85);color:#c2410c;border:1px solid #fdba74;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:#ffedd5;box-shadow:0 8px 20px rgba(249,115,22,.1)}
.error{border:1px solid #fecaca;box-shadow:0 8px 20px rgba(220,38,38,.06);animation:errorBounce .35s ease}
.recipe-head{align-items:center}
.recipe-head h2{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.2}
.ing-list{gap:9px;margin:18px 0}
.ing-list span{padding:7px 13px;border-radius:999px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.progress{height:12px;margin:20px 0 8px;background:#ffedd5;box-shadow:inset 0 2px 5px rgba(124,45,18,.08)}
.progress div{background:linear-gradient(90deg,#ea580c,#fb923c,#fbbf24,#f97316);background-size:240% 100%;border-radius:99px;animation:progressShine 3s linear infinite;transition:width .65s cubic-bezier(.2,.8,.2,1)}
.progress-label{font-weight:750;color:#9a3412}
.steps{gap:13px;margin-top:20px}
.step{
  gap:15px;padding:17px;border-radius:19px;background:rgba(255,250,245,.9);
  border:1px solid #f2dfcc;animation:stepReveal .45s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}
.step:hover{transform:translateX(5px);box-shadow:0 10px 25px rgba(124,45,18,.07)}
.step .num{width:39px;height:39px;font-size:.98rem;background:#ffedd5;color:#9a3412;box-shadow:inset 0 0 0 1px rgba(249,115,22,.08)}
.step.current{border-color:#fb923c;background:linear-gradient(120deg,rgba(255,237,213,.9),rgba(255,250,245,.95));box-shadow:0 0 0 4px rgba(249,115,22,.08);animation:stepReveal .45s ease both,currentHalo 3s ease-in-out infinite}
.step.current .num{background:linear-gradient(135deg,#ea580c,#fb923c);box-shadow:0 5px 14px rgba(234,88,12,.25)}
.step.done .num{background:linear-gradient(135deg,#16a34a,#4ade80);animation:donePop .45s ease}
.step p{line-height:1.7}
.finished{border:1px solid #fed7aa;background:linear-gradient(120deg,#ffedd5,#fff7ed);box-shadow:0 10px 30px rgba(249,115,22,.08);animation:sectionReveal .55s ease both}
.chat{gap:13px;max-height:390px;padding:8px 4px 14px;scrollbar-width:thin;scrollbar-color:#fdba74 transparent}
.msg{max-width:min(86%,620px);padding:12px 16px;line-height:1.65;box-shadow:0 5px 16px rgba(124,45,18,.055);animation:messagePop .3s cubic-bezier(.2,.8,.2,1) both}
.msg.ai{background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid #f2dfcc;border-bottom-left-radius:5px}
.msg.me{background:linear-gradient(120deg,#c2410c,#f97316);border:1px solid rgba(255,255,255,.2);border-bottom-right-radius:5px}
.chat-form{gap:10px;margin-top:12px}
.chat-form input{border:2px solid #f2dfcc;border-radius:15px;background:rgba(255,250,245,.95);padding:14px 16px;transition:border-color .2s,box-shadow .2s}
.chat-form input:focus{border-color:#fb923c;box-shadow:0 0 0 4px rgba(249,115,22,.1)}
.spinner{width:19px;height:19px;border-width:3px;filter:drop-shadow(0 0 5px rgba(255,255,255,.3))}
.typing i{width:8px;height:8px;background:#f97316}
footer{padding:15px 0 35px;color:#927b68}
:focus-visible{outline:3px solid rgba(249,115,22,.55);outline-offset:3px}
@keyframes heroReveal{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sectionReveal{from{opacity:0;transform:translateY(22px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleShimmer{0%{background-position:0% center}100%{background-position:220% center}}
@keyframes orbDrift{0%{transform:translate3d(0,-18px,0) scale(.95)}100%{transform:translate3d(38px,35px,0) scale(1.1)}}
@keyframes badgeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes toplineFlow{0%{background-position:0% 50%}100%{background-position:250% 50%}}
@keyframes chipAppear{from{opacity:0;transform:scale(.78) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes progressShine{0%{background-position:0% 0}100%{background-position:240% 0}}
@keyframes stepReveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes currentHalo{0%,100%{box-shadow:0 0 0 3px rgba(249,115,22,.06)}50%{box-shadow:0 0 0 6px rgba(249,115,22,.12)}}
@keyframes donePop{0%{transform:scale(.7) rotate(-12deg)}70%{transform:scale(1.14) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes messagePop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes errorBounce{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:620px){
  header{padding:42px 16px 18px}header h1{font-size:clamp(2.2rem,11vw,3.4rem)}
  main{padding:12px 12px 30px}.card{padding:21px;border-radius:23px}
  .recipe-head{align-items:flex-start}.step{padding:14px;gap:12px}.step .num{width:35px;height:35px}
  .chat-form{align-items:stretch}.chat-form .btn{padding-inline:15px}.msg{max-width:92%}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#17110d;--card:rgba(38,27,20,.88);--text:#fff3e8;--muted:#c6ae9b;--line:#4a3528;--accent:#fb923c;--accent-d:#fdba74;--accent-soft:#3d291d;--bubble-ai:#30231b;--bubble-me:#c2410c;--shadow:0 22px 70px rgba(0,0,0,.28)}
  body{background:radial-gradient(ellipse at 12% 4%,rgba(194,65,12,.18),transparent 32%),linear-gradient(135deg,#17110d,#21160f 55%,#17110d);color:#fff3e8}
  header p,footer,.hint{color:#c6ae9b}
  .card{background:rgba(38,27,20,.82);border-color:#4a3528}
  .chip-box,.chat-form input,.quick button,.suggest button,.step{background:rgba(31,22,16,.92);color:#fff3e8;border-color:#4a3528}
  .chip,.ing-list span{background:#3d291d;color:#fdba74;border-color:#70401f}
  .msg.ai{background:#30231b;border-color:#4a3528}
  .step.current{background:linear-gradient(120deg,#3d291d,#261b14)}
  .finished{background:linear-gradient(120deg,#3d291d,#261b14);border-color:#70401f}
  .progress{background:#3d291d}
  header:before{background:#3d291d;color:#fdba74;border-color:#70401f}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<div class="ambient-orb orb-one" aria-hidden="true"></div><div class="ambient-orb orb-two" aria-hidden="true"></div><div class="ambient-orb orb-three" aria-hidden="true"></div>
<header>
  <h1>🍳 AI Recipe Maker</h1>
  <p>Tell the chef what's in your kitchen. Get a recipe, then cook it step by step.</p>
</header>

<main>
  <!-- STEP 1: ingredients -->
  <section class="card" id="setup">
    <h2>What ingredients do you have?</h2>
    <div class="chip-box" id="chipBox">
      <input id="ingInput" placeholder="Type an ingredient and press Enter" autocomplete="off">
    </div>
    <p class="hint">Press Enter or comma to add. Backspace removes the last one.</p>
    <div class="quick" id="quick"></div>
    <button class="btn block" id="goBtn">Generate recipe</button>
    <div class="error hidden" id="setupError"></div>
  </section>

  <!-- STEP 2: recipe -->
  <section class="card hidden" id="recipeCard">
    <div class="recipe-head">
      <h2 id="rName"></h2>
      <button class="btn ghost" id="newBtn">New recipe</button>
    </div>
    <div class="ing-list" id="rIngredients"></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="progress-label" id="barLabel"></div>
    <ol class="steps" id="steps"></ol>
    <div class="finished hidden" id="finished">🎉 Recipe completed! Enjoy your meal!</div>
    <button class="btn block" id="nextBtn">✔ Done, show next step</button>
  </section>

  <!-- STEP 3: chat -->
  <section class="card hidden" id="chatCard">
    <h2>👨‍🍳 Ask the chef</h2>
    <div class="suggest" id="suggest"></div>
    <div class="chat" id="chat"></div>
    <form class="chat-form" id="chatForm">
      <input id="chatInput" placeholder="Ask anything, or type “done” for the next step" autocomplete="off">
      <button class="btn" id="sendBtn" type="submit">Send</button>
    </form>
  </section>
</main>
<footer>Powered by Google Gemini · LangChain</footer>

<script>
const $ = id => document.getElementById(id);
let ingredients = [];

/* ---------- ingredient chips ---------- */
const QUICK = ["Eggs","Tomato","Onion","Rice","Chicken","Potato","Cheese","Garlic","Paneer","Bread"];
QUICK.forEach(q => { const b = document.createElement("button"); b.type="button"; b.textContent = "+ " + q; b.onclick = () => addIng(q); $("quick").appendChild(b); });
function renderChips(){
  $("chipBox").querySelectorAll(".chip").forEach(c => c.remove());
  ingredients.forEach((ing,i) => {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = ing;
    const x = document.createElement("button"); x.type="button"; x.textContent="×"; x.setAttribute("aria-label","Remove "+ing);
    x.onclick = e => { e.stopPropagation(); ingredients.splice(i,1); renderChips(); };
    c.appendChild(x); $("chipBox").insertBefore(c, $("ingInput"));
  });
}
function addIng(v){
  v = v.trim(); if(!v) return;
  if(!ingredients.some(i => i.toLowerCase()===v.toLowerCase())) ingredients.push(v);
  $("ingInput").value=""; renderChips();
}
$("chipBox").onclick = () => $("ingInput").focus();
$("ingInput").addEventListener("keydown", e => {
  if(e.key==="Enter" || e.key===","){ e.preventDefault(); addIng($("ingInput").value); }
  else if(e.key==="Backspace" && !$("ingInput").value){ ingredients.pop(); renderChips(); }
});

/* ---------- API helper ---------- */
async function api(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});
  let data = {}; try { data = await r.json(); } catch(e){}
  if(!r.ok) throw new Error(data.error || "Something went wrong. Please try again.");
  return data;
}

/* ---------- generate recipe ---------- */
$("goBtn").onclick = async () => {
  addIng($("ingInput").value);
  $("setupError").classList.add("hidden");
  if(!ingredients.length){ showSetupError("Please add at least one ingredient."); return; }
  $("goBtn").disabled = true; $("goBtn").innerHTML = '<span class="spinner"></span> Cooking up a recipe…';
  try{
    const d = await api("/api/start", {ingredients: ingredients.join(", ")});
    $("setup").classList.add("hidden"); $("recipeCard").classList.remove("hidden"); $("chatCard").classList.remove("hidden");
    $("chat").innerHTML = ""; $("suggest").innerHTML = "";
    $("rName").textContent = d.name;
    $("rIngredients").innerHTML = ""; (d.ingredients||[]).forEach(t => { const s=document.createElement("span"); s.textContent=t; $("rIngredients").appendChild(s); });
    renderSteps(d);
    addMsg("ai", "Hi! I'm your chef. Cook along and press “Done” after each step. Ask me about substitutions, timing or tips anytime.");
    ["Can I substitute an ingredient?","How do I know it's cooked?","Any tips for more flavour?"].forEach(t => { const b=document.createElement("button"); b.type="button"; b.textContent=t; b.onclick=()=>{ $("chatInput").value=t; $("chatForm").requestSubmit(); }; $("suggest").appendChild(b); });
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){ showSetupError(e.message); }
  finally{ $("goBtn").disabled=false; $("goBtn").textContent="Generate recipe"; }
};
function showSetupError(m){ $("setupError").textContent=m; $("setupError").classList.remove("hidden"); }

/* ---------- steps ---------- */
function renderSteps(d){
  const list = $("steps"); const had = list.children.length; list.innerHTML = "";
  d.steps.forEach((t,i) => {
    const done = i+1 < d.current || d.finished;
    const li = document.createElement("li");
    li.className = "step " + (done ? "done" : "current");
    li.innerHTML = '<div class="num"></div><div><strong></strong><p></p></div>';
    li.querySelector(".num").textContent = done ? "✓" : i+1;
    li.querySelector("strong").textContent = "Step " + (i+1);
    li.querySelector("p").textContent = t;
    list.appendChild(li);
  });
  const doneCount = d.finished ? d.total : d.current-1;
  $("bar").style.width = (doneCount/d.total*100)+"%";
  $("barLabel").textContent = d.finished ? "All "+d.total+" steps complete" : "Step "+d.current+" of "+d.total;
  $("finished").classList.toggle("hidden", !d.finished);
  $("nextBtn").classList.toggle("hidden", d.finished);
  if(had && list.lastElementChild) list.lastElementChild.scrollIntoView({behavior:"smooth",block:"center"});
}
$("nextBtn").onclick = async () => {
  $("nextBtn").disabled = true;
  try{ renderSteps(await api("/api/next")); }catch(e){ addMsg("ai","⚠️ "+e.message); }
  finally{ $("nextBtn").disabled=false; }
};

/* ---------- chat ---------- */
function addMsg(who, text){
  const m = document.createElement("div"); m.className = "msg "+who; m.textContent = text;
  $("chat").appendChild(m); $("chat").scrollTop = $("chat").scrollHeight; return m;
}
$("chatForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("chatInput").value.trim(); if(!text) return;
  $("chatInput").value = ""; addMsg("me", text); $("sendBtn").disabled = true;
  const wait = addMsg("ai",""); wait.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  try{
    const d = await api("/api/chat", {message:text});
    if(d.action==="next"){ wait.textContent = d.finished ? "Wonderful, you finished the recipe! 🎉" : "Great! Here is the next step 👇"; renderSteps(d); }
    else wait.textContent = d.reply;
  }catch(err){ wait.textContent = "⚠️ " + err.message; }
  finally{ $("sendBtn").disabled=false; $("chatInput").focus(); $("chat").scrollTop=$("chat").scrollHeight; }
};

/* ---------- new recipe ---------- */
$("newBtn").onclick = async () => {
  try{ await api("/api/reset"); }catch(e){}
  ingredients = []; renderChips();
  $("recipeCard").classList.add("hidden"); $("chatCard").classList.add("hidden"); $("setup").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"}); $("ingInput").focus();
};
</script>
</body>
</html>
